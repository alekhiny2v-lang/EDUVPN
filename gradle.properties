# Project-wide Gradle settings for EDUVPN.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory: ics-openvpn uses it throughout.
android.useAndroidX=true

# The vendored ics-openvpn module still references its own R class entries from
# other modules; keep non-transitive R classes off until that module is cleaned up.
android.nonTransitiveRClass=false

# Kotlin
kotlin.code.style=official
